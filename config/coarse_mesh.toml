[calibration]
# The coarse-only six-surface recovery field targets the symmetric rear-top-
# shell PLC intersections seen across the coarse probes.  A 0.25 m cap still
# intersected at global 0.40 m, so the local cap is tightened to 0.225 m.
# The recovered 0.30 m and 0.32 m projections measured 332375 and 321144
# cells.  Their fixed locally refined rear-shell floor invalidates a simple
# global h^-3 extrapolation.  A two-point floor-plus-power fit predicts about
# 292768 cells at 0.40 m; the actual projection proved 294059.  The second
# point is 0.32 m: a conservative cubic projection from that measured first
# point is about 574334 cells, leaving margin below the 750000 calibration cap.
characteristic_lengths_m = [0.40, 0.32]
maximum_3d_elements = 750000
maximum_elapsed_seconds = 840.0
new_output_directory_required = true

[boundary_layer]
first_layer_height_source = "evidence.solution_yplus.first_layer_height_m"
construction_shell_height_source = "base_smoke_contract.construction_first_layer_height_m"
growth_ratio_source = "project.mesh.initial_growth_ratio"
minimum_layer_count_source = "project.mesh.minimum_prism_layers"
target_layer_count_source = "project.mesh.target_prism_layers"
method = "turbulent_flat_plate_delta99_0p37_re_x_minus_one_fifth"
thickness_safety_factor = 1.20
maximum_layer_count = 80
maximum_core_to_last_layer_ratio = 10.0
# Keep each wall-normal stack below half of the measured one-sided clearance,
# leaving a nonzero core allowance even when opposing walls use the same rule.
maximum_clearance_fraction = 0.40
planning_core_size_m = 0.07162
requires_solution_based_yplus_validation = true
requires_solution_based_outer_edge_validation = true

[meshing]
element_order = 1
core_tetra_meshing_algorithm = 10
core_tetra_meshing_algorithm_name = "HXT"
general_num_threads = 1
allowed_3d_element_types = ["Prism 6", "Pyramid 5", "Tetrahedron 4"]
runtime_tags_present = false

# Coarse-only recovery for the rear top-shell PLC intersections observed in
# the coarse projections.  Selection remains stable across Gmsh sessions: no
# runtime entity tags are persisted.  The 0.225 m cap is a bounded tightening
# from the authoritative 0.25 m HXT scale after a 0.25 m local cap still
