[scope]
case_id = "M50_H21_A8_B0"
mesh_level = "boundary_layer_smoke"
solver = "RANS"
turbulence_model = "SST"
nproc = 1
gpu_enabled = false
production_eligible = false
physical_convergence_claim_allowed = false
maximum_3d_elements = 300000
startup_iterations = 20
maximum_diagnostic_iterations = 500
timeout_seconds = 840.0

[numerics]
spatial_order = 1
cfl_number = 0.05
cfl_adapt = false
gradient_method = "GREEN_GAUSS"
flow_convective_method = "ROE"
turbulence_convective_method = "SCALAR_UPWIND"
flow_time_discretization = "EULER_IMPLICIT"
turbulence_time_discretization = "EULER_IMPLICIT"
linear_solver = "FGMRES"
linear_solver_preconditioner = "ILU"
linear_solver_error = 0.001
linear_solver_iterations = 10
freestream_turbulence_intensity = 0.01
freestream_turbulent_to_laminar_viscosity_ratio = 10.0

[boundary_contract]
farfield_role = "front_conical_surface"
wall_role = "vehicle_internal_and_external_walls"
rear_outlet_roles = ["rear_outlet_1", "rear_outlet_2"]
rear_outlet_mode = "PROVISIONAL_SUPERSONIC_DIAGNOSTIC_ONLY"
su2_rear_outlet_option = "MARKER_SUPERSONIC_OUTLET"
allow_static_outlet_pressure = false
allow_back_pressure = false
boundary_mode_frozen = false

[wall_contract]
velocity = "no_slip"
thermal = "adiabatic"
su2_option = "MARKER_HEATFLUX"
heat_flux_w_m2 = 0.0

[yplus_gate]
target = 0.7
maximum = 1.0
require_all_wall_samples_finite = true
require_positive_sample = true
maximum_exceedance_area_fraction = 0.0

[measurement_gate]
maximum_relative_area_error = 0.15
minimum_selected_cell_count = 1

[output]
solution_prefix = "rans_solution"
history_basename = "history"
write_frequency = 1
volume_fields = [
  "COORDINATES",
  "SOLUTION",
  "PRIMITIVE",
]
required_point_arrays = [
  "Density",
  "Momentum",
  "Velocity",
  "Mach",
  "Pressure",
  "Temperature",
  "Y_Plus",
  "Skin_Friction_Coefficient",
]
output_files = ["RESTART", "PARAVIEW", "SURFACE_PARAVIEW"]
